name: Backend smoke tests

on:
  push:
    branches:
      - main
      - feature/resend-email-verification
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run route smoke tests
        run: npm test
